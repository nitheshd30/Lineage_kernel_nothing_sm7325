name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v3
        with:
          path: hostrepo  # avoid conflict with 'kernel' directory

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_nothing_sm7325 kernel

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod \
            libssl-dev libncurses5-dev libelf-dev python3 python3-pip unzip \
            wget ccache rsync zip

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Set Up Environment Variables
        run: |
          echo "CLANG_PATH=${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_ENV
          echo "KERNEL_DIR=${GITHUB_WORKSPACE}/kernel" >> $GITHUB_ENV
          echo "OUT_DIR=${GITHUB_WORKSPACE}/kernel/out" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=${CLANG_PATH}/aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=${CLANG_PATH}/arm-linux-gnueabi-
          export PATH=${CLANG_PATH}:${PATH}

          cd $KERNEL_DIR
          make O=out vendor/lahaina-qgki_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
            LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
