name: Build Nothing Phone 1 Kernel (sm7325/v/mr)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev python3 libarchive-tools

      - name: Clone Kernel Source
        run: |
          # Clones the specific branch for Nothing OS 3.0+ updates
          git clone --depth=1 https://github.com/NothingOSS/android_kernel_msm-5.4_nothing_sm7325.git -b sm7325/v/mr kernel-source

      - name: Setup Toolchain (AOSP Clang)
        run: |
          # Stable method: clone from main branch to avoid 404 archive errors
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b main $GITHUB_WORKSPACE/clang-aosp

      - name: Setup KernelSU
        working-directory: kernel-source
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        working-directory: kernel-source
        run: |
          # Locate the versioned clang directory dynamically
          CLANG_DIR=$(find $GITHUB_WORKSPACE/clang-aosp -name "clang-r*" -type d | head -n 1)
          export PATH=$CLANG_DIR/bin:$PATH
          
          # Environment variables for Snapdragon 778G+ (msm-5.4)
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Fix for "The base file .config does not exist":
          # Qualcomm kernels often require the 'vendor/' prefix in the make command
          make O=out vendor/lahaina_QGKI.config
          
          # Compile the image
          make -j$(nproc --all) O=out CC=clang

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          # Checks for the built image and copies it for zipping
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../Nothing-sm7325-v-mr-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Kernel-Zip
          path: Nothing-sm7325-v-mr-Kernel.zip
